[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[6001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=6001-auth
aors=6001

[6001-auth]
type=auth
auth_type=userpass
username=6001
password=pass6001

[6001]
type=aor
max_contacts=1

[6002]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=6002-auth
aors=6002

[6002-auth]
type=auth
auth_type=userpass
username=6002
password=pass6002

[6002]
type=aor
max_contacts=1
